<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTOCK</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<!-- Corpo do projecto -->

<body>
  <!-- Cabeçalho -->
  <header class="cabeca">
    <h1><i>SIS<strong style="color: #C5A47E;">TOCK > </strong></i>DASHBOARD</h1>
    <div style="display: flex; justify-items: center;">
      <i class="fas fa-user"></i>
      <h3 style="color: #ddd;">Fidel Malutto</h3>
    </div>
  </header>
  <main>

    <!-- Barra lateral -->
    <div class="lateral">
      <li style="background: #C5A47E;"><a href="" style="color: #1E1E1E;"><strong><i
              class="fa fa-home"></i></strong></a></li>
      <li><a href="produtos.html"><i class="fa fa-plus"></i></a></li>
      <li><a href=""><i class="fa fa-tags"></i></a></li>
      <li><a href="users.html"><i class="fa fa-users"></i></a></li>
      <li><a href=""><i class="fa fa-trash-alt"></i></a></li>
    </div>

    <div class="container">
      <!-- Principal (main da Dashboard) -->
      <div class="dashboard">
        <br>
        <h1 style="color: #ddd;"></h1>
        <div class="elements">
          <!-- Cards das Categorias -->
          <!-- Valor do Stock -->
          <div class="card">Valor total em Stock<br>
            <div style="width: 300px; height: 100px; background: #1e1e1e; padding: 20px; border-radius: 8px;">
              <svg viewBox="0 0 200 60" preserveAspectRatio="none" style="width: 160%; height: 250%;">
                <defs>
                  <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#C5A47E; stop-opacity:0.4" />
                    <stop offset="100%" style="stop-color:#C5A47E; stop-opacity:0" />
                  </linearGradient>
                </defs>
                <path d="M0,50 Q40,45 80,35 T160,15 T200,10 L200,60 L0,60 Z" fill="url(#grad1)" />
                <path d="M0,50 Q40,45 80,35 T160,15 T200,10" fill="none" stroke="#C5A47E" stroke-width="0.3" />
              </svg>
            </div><br><br><br>
            <h1>...</h1>
          </div>

          <!-- Produtos em Stock -->
          <div class="card">Total de produtos em Stock<br>
            <div style="width: 300px; height: 100px; background: #1e1e1e; padding: 20px; border-radius: 8px;">
              <svg viewBox="0 0 200 60" preserveAspectRatio="none" style="width: 160%; height: 250%;">
                <defs>
                  <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#C5A47E; stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#C5A47E; stop-opacity:0" />
                  </linearGradient>
                </defs>
                <path d="M0,55 C50,55 100,40 150,30 S200,10 200,10 L200,60 L0,60 Z" fill="url(#grad2)" />
                <path d="M0,55 C20,65 100,40 150,30 S200,20 200,10" fill="none" stroke="#C5A47E" stroke-width="0.3" />
              </svg>
            </div><br><br><br>
            <h1>...</h1>
          </div>

          <!-- Stock Baixo -->
          <div class="card">Avisos de Stock Baixo<br>
            <div style="width: 300px; height: 100px; background: #1e1e1e; padding: 20px; border-radius: 8px;">
              <svg viewBox="0 0 200 60" preserveAspectRatio="none" style="width: 160%; height: 250%;">
                <defs>
                  <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#C5A47E; stop-opacity:0.4" />
                    <stop offset="100%" style="stop-color:#C5A47E; stop-opacity:0" />
                  </linearGradient>
                </defs>
                <path d="M0,50 L40,50 C60,50 70,10 90,10 C110,10 130,45 150,45 L200,45 L200,60 L0,60 Z"
                  fill="url(#grad3)" />
                <path d="M0,50 L40,50 C60,50 70,10 90,10 C110,10 130,45 150,45 L200,45" fill="none" stroke="#C5A47E"
                  stroke-width="0.3" />
              </svg>
            </div><br><br><br>
            <h1>...</h1>
          </div>
          <div class="card">Itens Recentes<h1>...</h1>
          </div>
        </div>
      </div>
      <div class="elements-views">
        <div class="ele">
          <h1 style="color: #ddd;">Inventário corrente</h1>
          <header class="cabecalho">
            <input placeholder="🔍   Pesquisa">
            <div>
              <button onclick="addNewProduct()"><strong>➕Adicionar Produto</strong></button>
              <button onclick="quickStockCount()"><strong>Conta rápida do Stock</strong></button>
            </div>
          </header>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
