             <h1><i>SIS<strong style="color: #C5A47E;">TOCK > </strong></i>PRODUTOS</h1>
             <div style="display: flex; justify-items: center;">
                 <i class="fas fa-user"></i><h3 style="color: #ddd;">Fidel Malutto</h3>
             </div>
         </header>
        <main>
            <div class="lateral">
                <li style="background: #C5A47E;"><a href="index.html" style="color: #1E1E1E;"><strong><i class="fa fa-home"></i></strong></a></li>

            <div class="container2">
                <!-- Principal (main da Dashboard) -->
                    <div class="dashboard">
                        <br>
                </div>
                <h1 style="color: #ddd;" id="hProd_d">Adicionar Produtos</h1>
                <h1 style="display: none; color: #ddd;" id="hProd">Produtos Adicionados</h1>
                <div class="elements-views" id="elements-views">
                    
    
            <form id="formulario">
                <input type="hidden" id="id">
                <input type="text" placeholder="Nome do Produto" name="nome" id="nome">
                <input type="number" placeholder="quantidade" name="quantidade" id="quantidade">
                <select id="categoria">
                    <option value="Computador">Computador</option>
                    <option value="Telemóvel">Telemóvel</option>
                    <option value="Cabo">Cabo</option> 
                    <option value="Carregador">Carregador</option>
                    <option value="Televisores">Televisores</option>
                    <option value="Colunas Bluetooth">Colunas Bluetooth</option>
                </select>
                <input type="number" placeholder="Preço do Produto" name="preco_unitario" id="preco_unitario"">
                <input type="text" placeholder="Marca" name="marca_produto" id="marca_produto">
                <input type="date" placeholder="Data de Cadastro" name="data_cadastro" id="data_cadastro">
                <input type="date" placeholder="Data de Entrada" name="data_entrada" id="data_entrada">
                <button type="submit" >Adicionar</button>
                <button onclick="verAdd()" style="margin-inline: 1vh;">Ver</button>
            </form>
                </div>
                <div class="produtos" id="produtos" style="display: none;">
                <button onclick="voltar()">⬅</button>
                <table id="adicionados">
                    <thead>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Categoria</th>
                        <th>Preço Unitário</th>
                        <th>Marca/Modelo</th>
                        <th>Data de Cadastro</th>
                        <th>Data de Entrada</th>
                        <th>Ações</th>
                    </thead>
                    <!-- Os produtos aparecem aqui... -->
                     <tbody id="datas"></tbody>
                </table>
            </div>
            </div>
        </main>
    </body>

<!-- Adicionar apenas com o JS-->
    <script>
        function verAdd(){
            document.getElementById("produtos").style.display="block";
            document.getElementById("elements-views").style.display="none";
            document.getElementById("hProd").style.display="block";
            document.getElementById("hProd_d").style.display="none";
        }

        function voltar(){
            document.getElementById("produtos").style.display="none";
            document.getElementById("elements-views").style.display="flex";
            document.getElementById("hProd").style.display="none";
            document.getElementById("hProd_d").style.display="block";
        }

        function removeItem(){
            const tb = document.getElementById("tb");
            document.getElementById("adicionados").removeChild(tb);
        };
    </script>
</html>
